# Manually-triggered workflow that builds the plugin and publishes it to the
# org's JFrog Artifactory Conan remote, so ib_win_core_dev's installer can
# pull it in as a Conan dependency (the same way it already does for
# ib_visual_studio_extensions). Not run automatically on push/PR - publishing
# a new Conan version is a deliberate, opt-in action tied to a version bump
# in gradle.properties, not every commit.
#
# GitHub Actions reference: https://docs.github.com/actions

name: Publish to Conan
on:
  workflow_dispatch:

jobs:
  publish:
    name: Build and publish to Conan
    runs-on: ubuntu-latest
    steps:

      # Check out the current repository
      - name: Fetch Sources
        uses: actions/checkout@v6

      # Set up the Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # Build plugin
      - name: Build plugin
        run: ./gradlew buildPlugin

      # Conan 1.x, matching the rest of the org's tooling (ib_win_core_dev's
      # CMake/Conan integration and ib_visual_studio_extensions' conanfile.py
      # both use the Conan 1.x API/CLI, not 2.x)
      - name: Install Conan
        run: pip install "conan<2.0"

      - name: Publish to Conan
        env:
          JFROG_USER: ${{ secrets.JFROG_CONAN_USERNAME }}
          JFROG_PASS: ${{ secrets.JFROG_CONAN_PASSWORD }}
        run: |
          conan --version
          conan remote add artifactory https://incredibuild.jfrog.io/artifactory/api/conan/ib-general-conan-local || echo "Remote already exists"
          conan user -r artifactory -p "$JFROG_PASS" "$JFROG_USER"

          VERSION=$(./gradlew properties --property version --quiet --console=plain | tail -n 1 | cut -f2- -d ' ')
          echo "Publishing intellij_ib_plugin/$VERSION"

          conan export-pkg . "intellij_ib_plugin/$VERSION@"
          conan upload intellij_ib_plugin --remote artifactory --all --confirm
          conan search intellij_ib_plugin --remote artifactory
